<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf1e4" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Akabare Panipuri: a Nepali street-food bluffing card game for 3 to 6 players. Stack puri, bid, eat, and don't bite the chili."
    />
    <title>Akabare Panipuri</title>
    <!-- Dai from the tavern, with an akabare tucked behind his ear (scripts/render-favicon.mjs). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- UI: Manrope (display), Atkinson Hyperlegible (body), Patrick Hand (accents), Baloo 2 (Devanagari).
         Cards: Rozha One + Mukta (the card art components keep their own type). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=Patrick+Hand&family=Baloo+2:wght@500..800&family=Mukta:wght@400;500;600;700;800&family=Rozha+One&family=Pixelify+Sans:wght@500..700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* First paint before the CSS bundle: the beige plate, no white flash. */
      html {
        background: #faf1e4;
        color: #130d01;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Akabare Panipuri needs JavaScript to play.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
