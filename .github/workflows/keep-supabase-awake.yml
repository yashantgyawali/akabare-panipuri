# Free Supabase projects pause after about a week without activity, which takes
# online play down. Once a day this asks the game Edge Function for a game that
# doesn't exist: the function runs and queries the database (real activity), and
# answers "not_found". Anything else (paused project, function down) fails the run,
# so GitHub emails you.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the game function (touches the database)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -u
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          for attempt in 1 2 3; do
            body=$(curl -sS --max-time 30 -X POST "$SUPABASE_URL/functions/v1/game" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" \
              -d '{"op":"get","code":"PNG22","token":"keepalive"}' || true)
            echo "attempt $attempt: $body"
            if echo "$body" | grep -q '"not_found"'; then
              echo "Supabase is awake."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Supabase did not answer as expected (paused or down?)."
          exit 1
